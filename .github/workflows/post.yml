name: Ahadeeth auto-post

on:
  schedule:
    # Kuwait is UTC+3. 10:00 Kuwait = 07:00 UTC ; 22:00 Kuwait = 19:00 UTC
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:            # lets you run it manually from the Actions tab
    inputs:
      dry_run:
        description: "Dry run (do not actually post)"
        type: boolean
        default: false

permissions:
  contents: write               # to commit the updated published.json ledger back

concurrency:
  group: auto-post              # never run two posts at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post next
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          IG_TOKEN:         ${{ secrets.IG_TOKEN }}
          IG_USER_ID:       ${{ secrets.IG_USER_ID }}
          PUBLIC_BASE_URL:  ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          python poster.py post-next ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Save ledger
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name  "ahadeeth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add published.json
          git commit -m "posted $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
